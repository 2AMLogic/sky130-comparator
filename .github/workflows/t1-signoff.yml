# T1 signoff gate (issue #31).
#
# Re-runs `klt signoff --manifest` against the committed block manifest so
# the block's T1 state is graded mechanically on every push instead of
# hand-read from prose, and so a manifest citing an artifact that has since
# changed (stale/unreadable/wrong-kind) FAILS here rather than rotting.
# "T1 not reached yet" is this block's honest state and does NOT fail this
# workflow -- the gate's rules are recorded in scripts/check-t1-signoff.py.
#
# The klt install is pinned to the version that graded the committed
# evidence record (manifests/t1-signoff-report.json), and the klayout engine
# under it is pinned to the version that klt build tests against
# (`klayout_version_expected()`) so an envelope regenerated here records
# `provenance.klayout_version_mismatch: false` instead of the tool's own
# "counts may differ" warning. Upgrade deliberately: bump both pins, re-run
# the regeneration command from manifests/README.md, and commit the refreshed
# record in the same change.

name: t1-signoff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Base commit for the sim/ append-only check (required; a manual run has no event base)"
        required: false

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sim/ append-only gate below needs the PR merge-base
      # and the push event's `before` commit (issue #138).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sim/ evidence is append-only (issue #138, sim/README.md "Append-only
      # rule"). The characterization-envelope freshness guard below cannot
      # enforce that -- `--update` re-pins whatever is on disk -- so this
      # compares protected paths against Git history. PR: head vs merge-base
      # with the target branch. main push: event.before vs the pushed head.
      # Manual dispatch has no event base: it needs the `base_sha` input and
      # FAILS without it rather than claim verification. An unavailable base
      # (branch creation, force-push) is likewise an explicit failure.
      - name: sim/ append-only gate selftest (hermetic)
        run: python3 scripts/check-sim-append-only.py selftest

      - name: sim/ evidence is append-only against the Git base
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: origin/${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ github.event.inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/check-sim-append-only.py gate --event "$EVENT" \
              --base-ref "$BASE_REF" --before "$BEFORE" \
              --base "$DISPATCH_BASE" --head "$HEAD_SHA"

      - name: Install klt (pinned; see manifests/README.md)
        run: python -m pip install "klayout-tools==0.7.0" "klayout==0.30.12"

      - name: Gate selftest (hermetic; proves the rot detector bites)
        run: python3 scripts/check-t1-signoff.py selftest

      # T1 item 8's evidence envelope (issue #86). The manifest's item-8 entry
      # is command-backed, so `klt signoff` below runs this same script and
      # grades the item on its stdout -- but a bare `unmet`/`check_failed` row
      # says nothing about WHICH artifact drifted. Running it here first makes
      # the failure legible (the script names the drifted path on stderr) and
      # runs its hermetic negative controls, which prove the drift guard bites
      # at all. Stdlib-only; no klt, no PDK.
      - name: Characterization-envelope selftest (hermetic)
        run: python3 scripts/characterization-envelope.py --selftest

      - name: Re-hash the characterization report and its cited records
        run: python3 scripts/characterization-envelope.py > /dev/null

      - name: Re-run T1 signoff against the committed manifest
        run: python3 scripts/check-t1-signoff.py gate

      # The LVS envelope's own rot check (issue #49). layout/lvs-report.json
      # is cited for item 4 (issue #123, see manifests/README.md), but a
      # manifest pins an envelope's *layout*-side hash only, so a change to the schematic (and therefore to
      # design/netlist.sh's output, the compare's reference side) would leave
      # it describing a compare that no longer describes the design.
      # `klt lvs --check` re-hashes BOTH sides plus the extraction deck and
      # exits 3 on drift. Cheap mode on purpose: --rerun reconstructs the
      # request from the report's own echoed fields, which do not include
      # reference.form / reference.device_map (klayout-tools#2459), so it
      # would report a reconstruction failure rather than real drift. No PDK
      # needed -- nothing here resolves one.
      - name: Re-hash the committed LVS envelope's own inputs
        run: klt lvs --check layout/lvs-report.json

      # The ERC supply-spec envelope's own rot check (issue #68).
      # layout/erc-report.json is cited for item 11 (issue #123, see
      # manifests/README.md), but the citation pins only the layout hash -- and it depends on a SECOND committed document,
      # layout/erc-spec.json, which nothing else pins: `klt signoff`'s item-11
      # path re-reads that spec from disk and does not check it against the
      # envelope's own provenance.spec.content_hash (klayout-tools#2496), so an
      # edited spec would silently change what a citation is graded on. There
      # is no `klt erc --check`, so this re-runs the documented command and
      # byte-compares: klt's own `--format json` stdout IS the committed file,
      # and a clean run exits 0, so a findings/skipped-work regression fails
      # here too. No PDK needed -- `--deck`/`--pdk` are curated-table names,
      # not an install (the same reason this job stays PDK-free).
      - name: Re-run the committed ERC supply spec and diff the envelope
        run: |
          klt erc layout/comparator.gds layout/erc-spec.json \
              --deck sky130 --pdk sky130 --format json > /tmp/erc-report.json
          diff -u layout/erc-report.json /tmp/erc-report.json

      # Rule-9 integrator view (issue #36): stdlib-only, no klt needed.
      - name: Integrator-view selftest (hermetic)
        run: python3 scripts/check-integrator-view.py selftest

      - name: Validate manifests/integrator-view.json
        run: python3 scripts/check-integrator-view.py gate

      # The full sim/tests/ unit suite (issue #57 added test_extract_pex.py;
      # #105 dropped the filter that limited this step to it). Hermetic and
      # stdlib-only -- no klt, no PDK, no ngspice, no pytest -- so the whole
      # suite gates here for free alongside the other PDK-free checks. Among
      # other things it pins the committed
      # layout/comparator.pex{,-preamp,-latch}.spice to the committed
      # layout/comparator.extract.spice by re-deriving them, which is the
      # cheap half of the layout-device-count job's `extract_pex.py --check`
      # (that one re-runs the extractor itself). Same discovery
      # sim/selftest.sh:68 runs for stage 1/4 of the acceptance test.
      - name: sim/tests unit suite (hermetic)
        run: python3 -m unittest discover -s sim/tests -t .

  # Layout device-count assertion (issue #44, T1 item 2's evidence):
  # klt extract over the committed layout/comparator.gds must re-derive the
  # schematic's 16 devices counted by model. Separate job because the live
  # extract needs the pinned sky130A PDK install (sim/pdk.json's own
  # install_command); the jobs above stay PDK-free.
  layout-device-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install klt + volare (pinned; see docs/environment-setup.md)
        run: python -m pip install "klayout-tools==0.7.0" "klayout==0.30.12" volare

      - name: Gate selftest (hermetic; proves a wrong count fails)
        run: python3 scripts/check-layout-device-count.py selftest

      - name: Enable the pinned sky130A PDK (sim/pdk.json)
        run: volare enable --pdk sky130 c6d73a35f524070e85faff4a6a9eef49553ebc2b

      - name: Re-run the device-count assertion over the committed GDS
        run: python3 scripts/check-layout-device-count.py gate --pdk-root ~/.volare

      # Post-layout (parasitics) reproducibility gate (issue #57, T1 item 7).
      # Re-extracts the committed GDS and diffs the result against the
      # committed layout/comparator.extract.spice + .pex.spice +
      # .pex-preamp.spice + .pex-latch.spice, and asserts the committed
      # layout/extract-parasitics.json carries this job's own pinned klt +
      # klayout. The pin assertion is not decoration: extracted resistances
      # differ up to 2.3x per net between klt/klayout builds (the committed
      # envelope's capacitances are bit-stable, its resistances are not), so
      # an off-pin extraction is a different measurement, not a different
      # version string. Exit 3 on drift.
      - name: Re-extract the parasitics and diff against the committed netlists
        run: PDK_ROOT="$HOME/.volare" python3 layout/extract_pex.py --check
